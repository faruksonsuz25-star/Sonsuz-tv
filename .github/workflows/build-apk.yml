name: Sonsuz TV APK Derle

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: ZIP dosyasini ac
        run: |
          if [ -f "sonsuz-tv-android" ]; then
            mv sonsuz-tv-android proje.zip
            unzip -o proje.zip
          else
            for f in *.zip; do
              unzip -o "$f"
            done
          fi

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: APK derle
        working-directory: sonsuz-tv-android
        run: gradle assembleDebug

      - name: APK dosyasini paylas
        uses: actions/upload-artifact@v4
        with:
          name: SonsuzTV-APK
          path: sonsuz-tv-android/app/build/outputs/apk/debug/app-debug.apk
          
